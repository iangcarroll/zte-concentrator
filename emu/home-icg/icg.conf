#日志等级：0-无，1-错误，2-警告，3-信息，4-调试
[ICGLogLevel]
ICGLogLevel=4

[TunnelIdentifier]
TunnelIdentifier=12345678

#强制使用本地缓存聚合服务器
#0: use cloud server config
#1: use local file config
#2: use mqtt server config
#ReMark: only for mqtt server identify
[ForceUsingLocalInfo]
ForceUsingLocalInfo=1

[IdentifyUser]
ReMark=0

#本地缓存的聚合服务器信息
[ServerInfo]
AggregationServerIP=__SERVER_IP__
AggregationServerTcpPort=__TCP_PORT__
AggregationServerUdpStartPort=__UDP_BASE__
AggregationServerTunIP=172.16.25.18
AggregationServerTun1IP=172.16.10.10
AggregationServerIcgId=1
UdpEchoServerIp=__SERVER_IP__
UdpEchoServerPort=8889

[ServerConfig]
ServerConfigSwitch=1
UdpRetranSwicth=1
UdpSortType=1
UdpSmoothTime=150
TcpSmoothTime=1
ReqRetranType=1

#DynamicSmoothTimeEnable 是否启用动态缓存机制(0:关闭 1:启用)
#DefSmoothTime (默认缓存时间) IncSmoothTime(每有一张卡block, 增加的缓存时间) MaxSmoothTime(最大缓存时间)
[DynamicSmoothTime]
DynamicSmoothTimeEnable=1
DefSmoothTime=5
IncSmoothTime=100
MaxSmoothTime=300

#WorkModeId 设备工作模式类型(0:纯非聚合模式 1:纯聚合模式 2:自由配置各个sim卡工作模式)
#Sim1WorkMode各个链路工作模式(0:非聚合 1:聚合)
[WorkModeInfo]
EnableWorkMode=1
WorkModeId=1
Sim1WorkMode=1
Sim1Weight=1
Sim2WorkMode=1
Sim2Weight=1
Sim3WorkMode=1
Sim3Weight=1
Sim4WorkMode=1
Sim4Weight=1
Sim5WorkMode=1
Sim5Weight=1
Sim6WorkMode=1
Sim6Weight=1
Wan1WorkMode=1
Wan1Weight=1
Wan2WorkMode=1
Wan2Weight=1

#非TCP报文弱排序功能在客户端侧的开关（0：关闭，1：开启）
[PacketSortEnable]
PacketSortEnable=1

#非TCP报文弱排序功能在服务端侧的开关（0：关闭，1：开启）
[ServerPacketSortEnable]
ServerPacketSortEnable=1

#Wan上联有线网口的信息(每个wan口的连接类型，static: 静态IP，dhcp：动态获取，disabled：关闭)
[WanConnectMode]
UsingOldVerWanConf=0
WanEthProtocol=dhcp
WanEthIp=172.31.1.254
WanEthNetmask=255.255.255.0
WanEthGateway=172.31.1.1
WanEthMtuEnable=1
WanEthMtu=1300

#线程池功能的开关（0：关闭，1：开启）
[UsingMemoryPool]
UsingMemoryPool=0

#APN的配置项（0:自动获取，1：手动配置）
[SimApnMode]
Sim1ApnProtocol=0
Sim1ApnAuthType=3
Sim1ApnString=1111
Sim1ApnUser=111
Sim1ApnPasswd=11
Sim2ApnProtocol=0
Sim2ApnAuthType=3
Sim2ApnString=2222
Sim2ApnUser=222
Sim2ApnPasswd=22
Sim3ApnProtocol=0
Sim3ApnAuthType=3
Sim3ApnString=3333
Sim3ApnUser=333
Sim3ApnPasswd=33
Sim4ApnProtocol=0
Sim4ApnAuthType=3
Sim4ApnString=4444
Sim4ApnUser=444
Sim4ApnPasswd=44
Sim5ApnProtocol=0
Sim5ApnAuthType=3
Sim5ApnString=5555
Sim5ApnUser=555
Sim5ApnPasswd=55
Sim6ApnProtocol=0
Sim6ApnAuthType=3
Sim6ApnString=6666
Sim6ApnUser=666
Sim6ApnPasswd=66
Sim7ApnProtocol=0
Sim7ApnAuthType=3
Sim7ApnString=7777
Sim7ApnUser=777
Sim7ApnPasswd=77
Sim8ApnProtocol=0
Sim8ApnAuthType=3
Sim8ApnString=8888
Sim8ApnUser=888
Sim8ApnPasswd=88
Sim9ApnProtocol=0
Sim9ApnAuthType=3
Sim9ApnString=9999
Sim9ApnUser=999
Sim9ApnPasswd=99

#防火墙功能开关（0：关闭，1：开启）
[EnableFirewall]
EnableFirewall=0

#UDP平滑参数
#UDP重传参数
#UDP发送线程循环时间（微秒）
#UDP丢包门限参数(LimitSendCount:触发丢包的门限个数, AllowSendCount:触发恢复的门限个数)
[UDP]
UdpStrongSortSwitch=1
UdpRetranSwitch=1
UdpSmoothTime=150
UdpRetranTime=60
UdpRetranCount=50
UdpWriteLoopTime=100
UdpDropPacketLimitSendCount=800
UdpDropPacketAllowSendCount=50

#TCP重传参数（TcpRetranTime:多长时间没收到数据包重传,TcpRetranCount: 重传请求一次最多请求多少个数据包）
#TCP发送线程循环时间（微秒）
#S1即send0反压控制的数量
#TCP平滑参数
#TCP crc32校验开关：0-关闭，1-开启
#UpTcpCrcSwitch上行tcp数据crc32校验开关
#DownTcpCrcSwitch下行tcp数据crc32校验开关
#TCP代理功能（0：关闭，1：开启）
[TCP]
TcpRetranTime=60
TcpRetranCount=50
TcpWriteLoopTime=500
TcpBacklogSendCount=150
TcpSmoothEnable=1
TcpSmoothTime=1
TcpUpCrcSwitch=0
TcpDownCrcSwitch=0
TcpSplitSwitch=1

#TcpTunnelSelectModel  0：普通选择模式 1：中位值模式 2：最小值范围模式
#TcpTunnelValidRtt TCP隧道可发送负载的最大Rtt值，超过该值则改用UDP隧道发送
#MidNumModelRange 中位值模式超过该值则无发送权限，单位毫秒
#MinRttModelRange 最小值范围模式超过该值则无发送权限，单位毫秒
[TcpTunnelSelectModel]
TcpTunnelSelectModel=2
TcpTunnelValidRtt=1000
MidNumModelRange=150
MinRttModelRange=10
DynamicRttRangeEnable=1

#视频传输增强的相关参数单位是毫秒ms
#SendCount是积压数量阈值，SendRtt是往返时间阈值
[EnhanceVideo]
EnhanceVideoSwitch=1
EnhanceVideoSendCount=50
EnhanceVideoSendRtt=150

#本地TCP连接的keepalive的参数
[LocalTcpKeepAlivePara]
LocalTcpKeepAliveEnable=1
LocalTcpKeepAliveIdle=1
LocalTcpKeepAliveInterval=1
LocalTcpKeepAliveCount=30

#隧道建立成功后，等待就绪的时间，单位是ms
[TunnelReadyWaitCountMs]
TunnelReadyWaitCountMs=1000

#EnableSimFlowThreshold（限速总开关  0:不限速  1:限速）
#UploadFlowThresholdSendSizeLimit （ICG发送队列数据包个数限制，超过限制后，限速失效）
#DownloadFlowThresholdSendSizeLimit （服务器发送队列数据包个数限制，超过限制后，限速失效）
[SimFlowThreshold]
EnableSimFlowThreshold=0
UploadFlowThresholdSendSizeLimit=50
DownloadFlowThresholdSendSizeLimit=50
Sim1UpFlowThreshold=5120000
Sim2UpFlowThreshold=5120000
Sim3UpFlowThreshold=5120000
Sim4UpFlowThreshold=5120000
Sim5UpFlowThreshold=5120000
Sim6UpFlowThreshold=5120000
Wan1UpFlowThreshold=5120000
Sim1DownFlowThreshold=5120000
Sim2DownFlowThreshold=5120000
Sim3DownFlowThreshold=5120000
Sim4DownFlowThreshold=5120000
Sim5DownFlowThreshold=5120000
Sim6DownFlowThreshold=5120000
Wan1DownFlowThreshold=5120000

#sim卡优先级（优先级1-10）
#EnableSimCardPriority  （0:关闭，1：开启）
#Upload/DownloadSendSizeLimit （当SendSize大于设定值时优选失效，所有通道都可以发）
#Upload/DownloadSendMode （0：视频质量优先，1：流量优先）
#Upload/DownloadSendRtt （选用视频质量优先后生效，该通道rtt小于设置的值才有发送权限，单位（毫秒））
[SimCardPriority]
EnableSimCardPriority=0
UploadSendSizeLimit=50
UploadSendMode=0
UploadSendRtt=150
DownloadSendSizeLimit=50
DownloadSendMode=0
DownloadSendRtt=150
Sim1Priority=1
Sim2Priority=1
Sim3Priority=1
Sim4Priority=1
Sim5Priority=1
Sim6Priority=1
Wan1Priority=1
Wan2Priority=1

#4G移动卡默认限速（单位：Kb）
[MobileUpFlowSpeedLimit]
EnableMobileUpFlowSpeedLimit=1
MobileUpFlowSpeedLimit=4000

#ICG设备硬件描述
# "MU5252", "DEV_TEST"
[HardwareName]
HardwareName=MU5252

# Wan: send to remote
# use '|' to add & sepearate another wan
# "eth1|eth2"
[AggEthInfo]
AggNetcard=rmnet_data0|V3E1net0|V3E2net0|eth0

# Lan: recv from local
# use '|' to add & sepearate another lan
# "eth1|eth2"
[LanEthInfo]
LanEthName=br-lan

[FEC]
FECRecvEnable=0
FECSendEnable=0
FECCommonNum=5
FECFECNum=1

[UdpChnn]
ChnnRttEnable=0
ChnnAllowCount=3
ChnnRecvPingCount=1
ChnnUpdateInterval=300
ChnnSendPingInterval=100

#MemProtectSwitch:内存保护的开关（0：关闭，1：开启）
#MemProtectLimit:内存占比大于门限时启动内存保护（默认30%）
[MemProtect]
MemProtectSwitch=1
MemProtectLimit=30

#ProxyfdQueueBlockCheckIdle:客户端代理fd队列拥塞的检测周期（默认100ms）
#ProxyfdQueueBlockCount:客户端代理fd队列拥塞的数据包个数（默认5000）
#TotalProxyfdQueueBlockCount:客户端所有代理fd队列拥塞的数据包个数（默认100000）
[ProxyfdQueue]
ProxyfdQueueBlockCheckIdle=50
ProxyfdQueueBlockCount=2000
TotalProxyfdQueueBlockCount=100000