# Backing store for the shim's libzte_router_uci_get/set.
#
# These are the uci keys zte_icg_agg actually reads. Values the binary writes
# are appended as comments, so watch the tail of this file (or the [shim] lines
# on stderr) to see icg_agg_status flip to 1 when a handshake succeeds.

# The GPIO-gated mode selector. SMULTIWAN is the bonding mode; the device
# normally only sets this when hardware key 0x408 reads 1.
zwrt_router.network.opms_wan_mode=SMULTIWAN

# Must be non-empty or the data plane refuses to start.
zwrt_router.icgmwan.IcgDevId=emu-0001

# With ForceUsingLocalInfo=1 in icg.conf these are not consulted for the
# server address, but the binary still reads some of them.
zwrt_router.icgmwan.AggTimerStatus=1
zwrt_router.icgmwan.AggServerIp=127.0.0.1
zwrt_router.icgmwan.IcgTcpAggPort=10088
zwrt_router.icgmwan.IcgUdpAggPort=10000
zwrt_router.icgmwan.AggregationServerTunIP=172.16.25.18
zwrt_router.icgmwan.residual_flow=107374182400

zwrt_router.other.device_type=icg_agg
zwrt_router.tmp_router.icg_agg_status=0
