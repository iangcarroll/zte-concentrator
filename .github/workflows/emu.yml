name: emu

# Builds the container that runs the device's real zte_icg_agg, and publishes it
# so nobody has to build it themselves. That is not a convenience: the image is
# aarch64 Alpine and the build installs a compiler, which on a poor connection
# takes long enough to be genuinely obstructive.
#
# Pull it instead:
#   docker pull ghcr.io/iangcarroll/zte-coord/emu:main
#
# The proprietary binary is never in the image. Mount it at run time.

on:
  push:
    branches: [main]
    paths:
      - 'emu/**'
      - '.github/workflows/emu.yml'
  pull_request:
    paths:
      - 'emu/**'
      - '.github/workflows/emu.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/emu

jobs:
  # Cheap, always runs, and catches the mistake that matters most: committing
  # ZTE's binary in the clear.
  no-plaintext-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no committed file may be an ELF
        run: |
          bad=0
          while IFS= read -r f; do
            # A tracked path can be absent from the worktree; skip those rather
            # than emitting noise from head(1).
            [ -f "$f" ] || continue
            case "$(head -c 4 "$f" | xxd -p 2>/dev/null)" in
              7f454c46)
                echo "::error file=$f::this is an ELF binary and must not be committed in the clear"
                bad=1 ;;
            esac
          done < <(git ls-files)
          exit $bad

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is linux/arm64 because the device is. x86 runners need QEMU
      # for the RUN steps; an arm64 host runs it natively.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: emu
          platforms: linux/arm64
          load: true
          tags: emu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The whole approach rests on one claim: zte_icg_agg imports only six
      # non-libc symbols, and the shim provides all of them. Assert it, so the
      # claim cannot rot silently.
      - name: the shim must export every symbol the binary needs
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh emu:test -c '
            for s in $(grep -v "^#" /etc/zteshim/expected-imports.txt); do
              if nm -D --defined-only /usr/lib/libzteshim.so 2>/dev/null | grep -q " $s\$"; then
                echo "  ok      $s"
              else
                echo "  MISSING $s"; fail=1
              fi
            done
            [ -z "${fail:-}" ]
          ' || {
            echo "::error::the shim no longer covers zte_icg_agg's imports"
            exit 1
          }

      - name: every DT_NEEDED name must resolve
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh emu:test -c '
            missing=0
            for so in $(grep -v "^#" /etc/zteshim/expected-libs.txt); do
              if [ -e "/usr/lib/$so" ] || [ -e "/lib/$so" ]; then
                echo "  ok      $so"
              else
                echo "  MISSING $so"; missing=1
              fi
            done
            [ "$missing" = 0 ]
          ' || {
            echo "::error::a library zte_icg_agg links against has no stub"
            exit 1
          }

      - name: the entrypoint must survive a dry run
        run: |
          # No binary to exec, so it should get all the way to the exec and then
          # fail with the documented message rather than crashing earlier.
          out=$(docker run --rm --platform linux/arm64 --cap-add NET_ADMIN emu:test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'no zte_icg_agg at' || {
            echo "::error::the entrypoint failed before it got to the exec"
            exit 1
          }

      - name: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: emu
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The point of the whole harness: prove the concentrator works against the
  # DEVICE'S OWN CLIENT, not against a client written from the same notes.
  #
  # Needs the ICG_BLOB_KEY secret to decrypt emu/blobs/zte_icg_agg.enc. Without
  # it the job says so and skips rather than failing, so the workflow is useful
  # before the secret exists.
  real-device:
    needs: build
    if: github.event_name != 'pull_request'
    # A NATIVE arm64 runner rather than x86 + QEMU.
    #
    # Under qemu-user the binary itself ran fine — config, hardware detection,
    # logging, tun0 — but every netlink operation failed ("Cannot talk to
    # rtnetlink: Not supported", "FIB table does not exist"), because qemu-user
    # does not translate rtnetlink faithfully. The device installs per-WAN
    # policy routing before it opens a tunnel, so those failures are worth
    # avoiding on their own.
    #
    # Being honest about the history: QEMU was NOT what kept the handshake from
    # completing. Native arm64 stalled at exactly the same point. The real
    # causes turned out to be that the device ships with ICGLogLevel=0 (so it
    # was failing silently), that it ignores any WAN without IFF_RUNNING, and
    # that it reads each WAN's address and gateway from a DHCP lease file whose
    # exact format it requires. See emu/entrypoint.sh.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: is the blob available?
        id: blob
        env:
          KEY: ${{ secrets.ICG_BLOB_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ICG_BLOB_KEY is not set, so the real binary cannot be decrypted — skipping"
            echo "have=no" >> "$GITHUB_OUTPUT"
          elif [ ! -f emu/blobs/zte_icg_agg.enc ]; then
            echo "::notice::emu/blobs/zte_icg_agg.enc is not committed yet — skipping"
            echo "have=no" >> "$GITHUB_OUTPUT"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: decrypt the device binary
        if: steps.blob.outputs.have == 'yes'
        env:
          ICG_BLOB_KEY: ${{ secrets.ICG_BLOB_KEY }}
        run: |
          go run ./emu/blobcrypt -d -in emu/blobs/zte_icg_agg.enc -out emu/blobs/zte_icg_agg
          chmod +x emu/blobs/zte_icg_agg
          # Confirm it is what we think it is, without printing anything from it.
          file emu/blobs/zte_icg_agg | grep -q 'ELF 64-bit.*aarch64' \
            || { echo "::error::the decrypted blob is not an aarch64 ELF"; exit 1; }
          echo "decrypted $(stat -c%s emu/blobs/zte_icg_agg) bytes"

      - uses: docker/setup-buildx-action@v3
        if: steps.blob.outputs.have == 'yes'

      - name: build the harness image
        if: steps.blob.outputs.have == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: emu
          platforms: linux/arm64
          load: true
          tags: emu:test
          cache-from: type=gha

      - name: real traffic through the real binary
        if: steps.blob.outputs.have == 'yes'
        env:
          IMAGE: emu:test
        run: |
          # The same script that runs locally (emu/e2e.sh), so CI and a
          # developer's laptop cannot drift apart. It stands up the
          # concentrator and the device, waits for the handshake, then pushes a
          # real HTTP request from a LAN client namespace through the tunnel
          # and asserts on the concentrator's own flow and reassembly counters.
          sudo modprobe tun 2>/dev/null || true
          ls -l /dev/net/tun
          BLOB=blobs/zte_icg_agg KEEP=1 ./emu/e2e.sh

      - name: logs
        # KEEP=1 above leaves the containers up precisely so this step can read
        # them after a failure.
        if: always() && steps.blob.outputs.have == 'yes'
        run: |
          echo "=== the device's own log ==="
          docker logs icgdev-e2e 2>&1 | tail -120 || true
          echo "=== concentrator ==="
          docker logs icgd-e2e 2>&1 | tail -80 || true
          docker rm -f icgdev-e2e icgd-e2e >/dev/null 2>&1 || true
          docker network rm icg-e2e >/dev/null 2>&1 || true
